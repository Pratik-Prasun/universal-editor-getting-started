<!-- Faintly Templates for Survey Block -->

<!-- Progress Bar Template - Enhanced with Completion State -->
<template data-fly-name="progress">
  <div class="progress">
    <span class="progress-complete" data-fly-test="isComplete">Complete!</span>
    <div class="progress-track">
      <div class="progress-fill" style="--width: ${progress}%; width: var(--width)"></div>
    </div>
    <div class="progress-counter">${questionsCompleted}/${totalActualQuestions}</div>
  </div>
</template>

<!-- Navigation Template -->
<template data-fly-name="navigation">
  <div class="nav">
    <button class="btn-back" type="button">Back</button>
    <button class="btn-next" type="button">Next</button>
  </div>
</template>

<!-- Fact Content Template -->
<template data-fly-name="fact-content">
  <div>
    <h1 class="title">${title}</h1>
    <p class="fact-content">${question}</p>
  </div>
</template>

<!-- Radio Options Template -->
<template data-fly-name="radio-options">
  <div class="options">
    <div class="option" data-fly-repeat.option="options">
      <input type="radio" id="${option.id}" name="${contentId}" value="${option.value}" />
      <label for="${option.id}">${option.text}</label>
    </div>
  </div>
</template>

<!-- Slider Template -->
<template data-fly-name="slider">
  <div class="slider-container">
    <h3 class="slider-question" data-fly-test="questionText">${questionText}</h3>
    <div class="slider-track-wrapper">
      <div class="slider-labels">
        <span data-fly-repeat.option="options">${option}</span>
      </div>
      <input class="slider" type="range" id="${contentId}" name="${contentId}" min="0" max="${optionsLength}" value="0" data-options="${optionsJson}" />
    </div>
  </div>
</template>

<!-- Main Survey Template -->
<template data-fly-name="main">
  <div class="survey-form">
    <!-- Progress section -->
    <div data-fly-include="progress"></div>
    
    <!-- Content section -->
    <div class="content">
      <span class="section-title">${section}</span>
      <div class="question-icon">${icon}</div>
      
      <!-- Dynamic content area - will be populated by contentElement -->
      <div data-fly-content="contentElement"></div>
      
      <!-- Navigation section -->
      <div data-fly-include="navigation"></div>
    </div>
  </div>
</template>
